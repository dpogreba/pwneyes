name: Build APK

on:
  push:
    branches: [ main, master, 'feature/**', beta ]
    tags:     [ 'v*.*' ]           # e.g. v1.1 — triggers GitHub Release creation
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# Allow the workflow to create GitHub Releases when a tag is pushed.
permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0        # git describe needs tags + history; default shallow returns none

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Must precede EVERY Gradle invocation, not just the build ones:
      # build.gradle.kts evaluates its "tag build must have a keystore" guard at
      # configuration time, so any gradle call on a tag ref — including the
      # `gradle wrapper` below — throws if KEYSTORE_PATH isn't set yet.
      # Tag builds only — keeps secret exposure to the runs that publish a release.
      - name: Decode signing keystore
        if: startsWith(github.ref, 'refs/tags/')
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set — a tag build cannot produce an installable APK."
            exit 1
          fi
          # Strip all whitespace first: GNU base64 -d tolerates \n but rejects \r,
          # and the secret picks up a CRLF when it is piped in from PowerShell or
          # pasted through the web UI. Without this the decode dies on "invalid input".
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/pwneyes-release.jks"
          test -s "$RUNNER_TEMP/pwneyes-release.jks" || {
            echo "::error::Decoded keystore is empty — KEYSTORE_BASE64 is truncated or not valid base64."
            exit 1
          }
          echo "KEYSTORE_PATH=$RUNNER_TEMP/pwneyes-release.jks" >> "$GITHUB_ENV"

      # gradle-wrapper.jar is gitignored (binary); regenerate it here so
      # ./gradlew works correctly for the rest of the build steps.
      - name: Generate Gradle wrapper JAR
        run: gradle wrapper --gradle-version 8.7 --distribution-type bin

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: pwneyes-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      # Verify before publishing anything, so an unsigned build can never leave
      # this job labelled as a release.
      - name: Verify release APK is signed
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "::error::$APK missing — release build was not signed."; exit 1; }
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          test -n "$APKSIGNER" || { echo "::error::apksigner not found in $ANDROID_HOME/build-tools."; exit 1; }
          "$APKSIGNER" verify --print-certs "$APK"

      # Filename differs by signing state (app-release.apk vs app-release-unsigned.apk).
      # The artifact name says which, so a branch build is never mistaken for a signed one.
      - name: Upload release APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: pwneyes-release-${{ startsWith(github.ref, 'refs/tags/') && 'signed' || 'unsigned' }}-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      # -----------------------------------------------------------------------
      # Create a GitHub Release when a version tag (e.g. v1.2.0) is pushed.
      # The in-app UpdateChecker queries the latest release to notify users.
      # To publish a release: git tag v1.2.0 && git push origin v1.2.0
      #
      # The asset is the SIGNED RELEASE APK. It used to be the debug APK, which
      # was signed with a throwaway debug key regenerated on every runner — so no
      # two releases shared a signature and updates could never install in place.
      # -----------------------------------------------------------------------
      - name: Rename APK for release
        if: startsWith(github.ref, 'refs/tags/')
        run: cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/PwnEyes-${{ github.ref_name }}.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: app/build/outputs/apk/release/PwnEyes-${{ github.ref_name }}.apk
